# Deploy the static site in ./site to GitHub Pages. No build step.
# Shape follows GitHub's own "Deploy static content to Pages" starter workflow
# (actions/starter-workflows, pages/static.yml), fetched 2026-09-04.
#
# Action versions resolved on 2026-09-04 (system clock) from
# https://api.github.com/repos/actions/<name>/releases/latest, and each floating
# major tag confirmed to exist via .../git/ref/tags/<major>:
#   actions/checkout               latest release v7.0.1 (2026-07-20)  tag v7 = 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/configure-pages        latest release v6.0.0 (2026-03-25)  tag v6 = 45bfe0192ca1faeb007ade9deae92b16b8254a0d
#   actions/upload-pages-artifact  latest release v5.0.0 (2026-04-10)  tag v5 = fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages           latest release v5.0.1 (2026-09-01)  tag v5 = 368f82528645a54fb793d4d04e342629a3f51346
# upload-pages-artifact stopped shipping dotfiles in v4.0.0 and added the
# include-hidden-files input in v5.0.0; it is set below so site/.nojekyll ships.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
